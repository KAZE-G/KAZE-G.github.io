<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>導覽｜やままち</title><link rel="stylesheet" href="site.css"></head>
<body>
<div class="frame-box">
<h2>山街　やままち</h2>
<p><a href="home.html" target="content">Home</a></p>
<p><a href="works.html" target="content">Works / Albums</a></p>
<p><a href="order.html" target="content">Order / Prices</a></p>
<p><a href="about.html" target="content">About</a></p>
<p><a href="contact.html" target="content">Contact</a></p>
<p>通り過ぎし旅人の数は：<br><img src="https://visitor-badge.laobi.icu/badge?page_id=yamamachi.home" alt="訪客計數器"></p>
</div>
<div class="frame-box">
<h3>音樂播放器</h3><div id="player-title">尚未播放</div>
<audio id="audio-player" controls preload="none" style="width:100%; margin-top:6px;"></audio>
<div id="player-like"></div>
<p><button type="button" onclick="previousTrack()">上一首</button> <button type="button" onclick="nextTrack()">下一首</button></p>
<div class="small" id="player-status">選擇作品頁的曲名即可播放。</div>
</div>
<script>
let playlist = [], currentIndex = -1, siteConfig = {};
const audio = document.getElementById('audio-player');
const title = document.getElementById('player-title');
const status = document.getElementById('player-status');
const playerLike = document.getElementById('player-like');
const LIKE_API = 'https://abacus.jsn.cam';
const LIKE_NAMESPACE = 'yamamachi.com';
function likeUrl(action,key) { return LIKE_API+'/'+action+'/'+encodeURIComponent(LIKE_NAMESPACE)+'/'+encodeURIComponent(key); }
async function readLikeCount(key) {
 const response=await fetch(likeUrl('get',key),{mode:'cors',cache:'no-store'});
 if(response.status===404) return 0;
 if(!response.ok) throw new Error('Like counter unavailable');
 const data=await response.json(); return Number(data.value)||0;
}
async function incrementLike(key) {
 const response=await fetch(likeUrl('hit',key),{mode:'cors',cache:'no-store'});
 if(!response.ok) throw new Error('HTTP '+response.status+' '+(await response.text()).slice(0,120));
 const data=await response.json();
 if(typeof data.value!=='number') throw new Error('Unexpected API response: '+JSON.stringify(data).slice(0,120));
 return data.value;
}
function createPlayerLikeButton(key) {
 const button=document.createElement('button'); button.type='button'; button.className='like-button'; button.textContent='♡ …';
 readLikeCount(key).then(count=>button.textContent='♡ '+count).catch(()=>button.textContent='♡ —');
 button.addEventListener('click',async()=>{
  if(button.disabled) return; button.disabled=true;
  try { button.textContent='♡ '+await incrementLike(key); }
  catch(error) { button.textContent='♡ !'; button.title=error.message || String(error); console.error('Like counter error:',error); }
  finally { button.disabled=false; }
 });
 return button;
}
function makeLikeKey(album,track,index) {
 const albumId=album.id || album.title || 'untitled-album';
 const trackId=track ? (track.id || track.title || ('track-'+(index+1))) : '';
 return track ? 'track_'+albumId+'_'+trackId : 'album_'+albumId;
}
function addAssetVersion(path) {
  if (!siteConfig.assetVersion || /[?&]v=/.test(path)) return path;
  return path + (path.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(siteConfig.assetVersion);
}
function resolveAlbumFile(album, file) {
  if (!file) return '';
  if (file.includes('://') || file.startsWith('//')) return file;
  let path = file;
  if (!file.startsWith('/')) {
    const rootPath = (siteConfig.worksDir || '/WORKS/').replace(/\/+$/, '');
    const folder = (album.dir || '').replace(/^\/+|\/+$/g, '');
    const base = (album.dir || '').startsWith('/') ? (album.dir || '').replace(/\/+$/, '') : [rootPath, folder].filter(Boolean).join('/');
    path = base + '/' + file;
  }
  return addAssetVersion(path);
}
function resolveAudio(album, track) {
  if (track.audio) return resolveAlbumFile(album, track.audio);
  if (track.file) return resolveAlbumFile(album, track.file);
  return '';
}
async function loadPlaylist() {
  try {
    const [response, configResponse] = await Promise.all([
      fetch('works.json', {cache: 'no-cache'}),
      fetch('site-config.json', {cache: 'no-cache'}).catch(() => null)
    ]);
    if (!response.ok) throw new Error('works.json unavailable');
    const data = await response.json();
    siteConfig = configResponse && configResponse.ok ? await configResponse.json() : {};
    playlist = (Array.isArray(data) ? data : (data.albums || [])).flatMap(album => (album.tracks || []).map((track,index) => ({...track, audio: resolveAudio(album, track), albumTitle: album.title || '', trackNumber: String(index+1).padStart(2,'0'), likeKey: makeLikeKey(album,track,index)}))).filter(track => track.audio);
  } catch (error) { status.textContent = '目前沒有可播放的曲目資料。'; }
}
function playTrack(src, trackTitle, albumTracks) {
  if (!src) { status.textContent = '這首曲目尚未提供音訊檔。'; return; }
  const chosen = Array.isArray(albumTracks) ? albumTracks.filter(track => track.audio) : [];
  playlist = chosen.length ? chosen : playlist;
  currentIndex = playlist.findIndex(track => track.audio === src);
  const track = currentIndex >= 0 ? playlist[currentIndex] : {};
  title.replaceChildren();
  const albumLine = document.createElement('div');
  albumLine.textContent = track.albumTitle || '';
  const trackLine = document.createElement('div');
  trackLine.textContent = [track.trackNumber ? track.trackNumber + '.' : '', trackTitle || track.title || '正在播放'].filter(Boolean).join(' ');
  if (albumLine.textContent) title.appendChild(albumLine);
  title.appendChild(trackLine);
  playerLike.replaceChildren();
  if (track.likeKey) playerLike.appendChild(createPlayerLikeButton(track.likeKey));
  audio.src = src; status.textContent = '';
  if (!track.likeKey) { playerLike.replaceChildren(); }
  audio.play().catch(() => { status.textContent = '請按播放器的播放鍵開始播放。'; });
}
function moveTrack(direction) {
  if (!playlist.length) return;
  if (currentIndex < 0) currentIndex = direction > 0 ? 0 : playlist.length - 1;
  else currentIndex = (currentIndex + direction + playlist.length) % playlist.length;
  const track = playlist[currentIndex]; playTrack(track.audio, track.title, playlist);
}
function previousTrack() { moveTrack(-1); }
function nextTrack() { moveTrack(1); }
audio.addEventListener('ended', nextTrack);
loadPlaylist();
</script></body></html>
