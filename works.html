<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>作品／專輯｜やままち</title><link rel="stylesheet" href="site.css"></head>
<body><h1>作品／專輯</h1><div id="works-list"><p>讀取作品資料中……</p></div>
<script>
const root = document.getElementById('works-list');
let siteConfig = {};
function addText(parent, tag, text, className) { const el=document.createElement(tag); el.textContent=text || ''; if(className) el.className=className; parent.appendChild(el); return el; }
function addLink(parent, text, href) { const link=document.createElement('a'); link.href=href || '#'; link.textContent=text; parent.appendChild(link); return link; }
function addAssetVersion(path) {
 if(!siteConfig.assetVersion || /[?&]v=/.test(path)) return path;
 return path + (path.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(siteConfig.assetVersion);
}
function resolveAlbumFile(album, file) {
 if(!file) return '';
 if(file.includes('://') || file.startsWith('//')) return file;
 let path=file;
 if(!file.startsWith('/')) {
  const rootPath=(siteConfig.worksDir || '/WORKS/').replace(/\/+$/, '');
  const folder=(album.dir || '').replace(/^\/+|\/+$/g, '');
  const base=(album.dir || '').startsWith('/') ? (album.dir || '').replace(/\/+$/, '') : [rootPath,folder].filter(Boolean).join('/');
  path=base + '/' + file;
 }
 return addAssetVersion(path);
}
function resolveAudio(album, track) {
 if(track.audio) return resolveAlbumFile(album,track.audio);
 if(track.file) return resolveAlbumFile(album,track.file);
 return '';
}
Promise.all([
 fetch('works.json',{cache:'no-cache'}).then(response => { if(!response.ok) throw new Error('works.json unavailable'); return response.json(); }),
 fetch('site-config.json',{cache:'no-cache'}).then(response => response.ok ? response.json() : {}).catch(() => ({}))
]).then(([data,config]) => {
 siteConfig=config || {};
 const albums=Array.isArray(data) ? data : (data.albums || []); root.replaceChildren();
 if(!albums.length) { addText(root,'p','作品資料尚未填入。'); return; }
 albums.forEach(album => {
  const tracks=(Array.isArray(album.tracks) ? album.tracks : []).map((track,index) => ({...track,audio:resolveAudio(album,track),lyrics:resolveAlbumFile(album,track.lyrics),albumTitle:album.title || '',trackNumber:String(index+1).padStart(2,'0')}));
  const box=document.createElement('section'); box.className='frame-box'; addText(box,'h2',album.title || '未命名專輯');
  const info=document.createElement('div'); info.className='album-info';
  const coverSrc=resolveAlbumFile(album,album.cover);
  if(coverSrc) { const image=document.createElement('img'); image.className='album-cover'; image.src=coverSrc; image.alt=(album.title || '專輯')+'封面'; info.appendChild(image); }
  const description=document.createElement('div'); description.className='album-description';
  if(album.description) addText(description,'p',album.description);
  (album.details || []).forEach(detail => addText(description,'p',detail,'small'));
  if(album.releaseDate) addText(description,'p','發行日期：'+album.releaseDate,'small');
  if(album.format) addText(description,'p','規格：'+album.format,'small');
  if(album.price) addText(description,'p','價格：'+album.price,'small');
  info.appendChild(description); box.appendChild(info);
  const listWrap=document.createElement('div'); listWrap.className='track-list-wrap';
  const list=document.createElement('table'); list.className='track-list';
  const tbody=document.createElement('tbody');
  tracks.forEach(track => {
   const row=document.createElement('tr');
   const index=document.createElement('td'); index.className='track-index'; index.textContent=track.trackNumber+'.'; row.appendChild(index);
   const titleCell=document.createElement('td'); titleCell.className='track-name-cell';
   const titleLink=document.createElement('a'); titleLink.className='track-name'; titleLink.href=track.audio || track.lyrics || '#'; titleLink.textContent=track.title || '未命名曲目';
   titleLink.addEventListener('click',event => {
    if(track.audio) { event.preventDefault(); try { parent.frames['sidebar'].playTrack(track.audio,track.title,tracks); } catch(error) { window.open(track.audio,'_blank'); } }
    else event.preventDefault();
   });
   titleCell.appendChild(titleLink); row.appendChild(titleCell);
   const duration=document.createElement('td'); duration.className='track-duration'; duration.textContent=track.duration || ''; row.appendChild(duration);
   const lyricsCell=document.createElement('td'); if(track.lyrics) addLink(lyricsCell,'.txt',track.lyrics); row.appendChild(lyricsCell);
   const audioCell=document.createElement('td'); if(track.audio) addLink(audioCell,'.mp3',track.audio); row.appendChild(audioCell);
   tbody.appendChild(row);
  });
  list.appendChild(tbody);
  listWrap.appendChild(list); box.appendChild(listWrap); root.appendChild(box);
 });
}).catch(() => { root.textContent='無法讀取 works.json，請確認作品資料檔存在。'; });
</script></body></html>
