<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>首頁｜やままち</title><link rel="stylesheet" href="site.css"></head>
<body>
<div class="frame-box"><h1> 山街は薫風霧雨、火山と廃坑の重なっている街　</h1><p>山街にいる風・kaze_ymmc的個人社團網站。</p><p>所有現実を、全て自分の方へ捻じ曲げたのだ</p><p>這裡是作品、音樂與個人活動的網站。</p></div>
<div class="frame-box"><h2>更新記錄</h2><ul id="updates-list"><li>115/10/27 Renewal.</li></ul></div>
<script>
fetch('updates.json').then(response => { if (!response.ok) throw new Error('updates unavailable'); return response.json(); }).then(items => {
 const list = document.getElementById('updates-list'); list.replaceChildren();
 if (!Array.isArray(items) || !items.length) { const li=document.createElement('li'); li.textContent='目前沒有更新記錄。'; list.appendChild(li); return; }
 items.forEach(item => { const li=document.createElement('li'); li.textContent=(item.date ? item.date + ' — ' : '') + (item.text || ''); list.appendChild(li); });
}).catch(() => {});
</script></body></html>
