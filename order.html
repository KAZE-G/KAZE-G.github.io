<!doctype html>
<html lang="zh-Hant">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂購／價目表｜やままち</title>
  <link rel="stylesheet" href="site.css"></head>
<body>
 <h1>訂購／價目表</h1>
 <section class="frame-box">
  <h2>作品與價格</h2>
  <p>作編詞曲 lyric.melody.arrange</p>
  <p>調教.VSQx/UTAU抓譜 VOCALOID</p>
  <p>吉他換弦.樂器維修</p>
  <p>8051等單晶片程式及電路設計</p>
  <p>應用程式設計</p>
  <p>tube circuit design</p>
  <p>攝影</p>
  <p>黑白暗房放像引伸.黑白正片.雙浴 monochrome darkroom. monochrome positive film develop</p>
  <p>簡易鏡片清理</p>
  <p>西式.日式料理</p>
  <p>整理中</p>
  <p id="order-status">讀取訂購資訊中……</p>
  <div id="price-list"></div></section>
<script>
Promise.all([fetch('site-config.json').then(r=>r.json()),fetch('works.json').then(r=>r.json())]).then(([config,data])=>{
 const albums=Array.isArray(data) ? data : (data.albums || []);
 document.getElementById('order-status').textContent=config.commissionsOpen ? '目前開放委託。' : '目前尚未公告訂購方式；價格與訂購資訊將於確認後更新。';
 const list=document.getElementById('price-list');
 albums.forEach(album=>{ const box=document.createElement('div'); box.className='frame-box'; const title=document.createElement('h3'); title.textContent=album.title || '未命名作品'; box.appendChild(title); const price=document.createElement('p'); price.textContent=album.price ? '價格：'+album.price : '價格：尚未公告'; box.appendChild(price); list.appendChild(box); });
}).catch(()=>{document.getElementById('order-status').textContent='訂購資訊尚未設定。';});
</script></body></html>
